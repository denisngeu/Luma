name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - android-v*

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/mobile
    env:
      EXPO_PUBLIC_LUMA_URL: https://cx9tpuja8iqkelk0zci4vlbs.app.luma-sas.fr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx expo prebuild --platform android --non-interactive
      - run: chmod +x android/gradlew && ./android/gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-0.3.7-test-apk
          path: native/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
