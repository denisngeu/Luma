name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - android-v*

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/mobile
    env:
      CI: 1
      EXPO_PUBLIC_LUMA_URL: https://cx9tpuja8iqkelk0zci4vlbs.app.luma-sas.fr
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: native/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-0.3.7-test-apk
          path: native/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
