services:
  luma:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Configure the internal PostgreSQL URL in Coolify}
      LUMA_UPLOAD_DIRECTORY: /app/.wrangler/state/uploads
      LUMA_ICE_SERVERS: ${LUMA_ICE_SERVERS:-[]}
      LUMA_MIGRATE_SQLITE: ${LUMA_MIGRATE_SQLITE:-0}
      LUMA_TURN_SECRET: ${SERVICE_PASSWORD_64_TURN}
      LUMA_TURN_PUBLIC_IP: ${LUMA_TURN_PUBLIC_IP:?Configure the public IPv4 address of this server}
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    volumes:
      - luma-data:/app/.wrangler/state
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok&&r.status!==302)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  turn:
    build:
      context: .
      dockerfile: docker/turn.Dockerfile
    restart: unless-stopped
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${SERVICE_PASSWORD_64_TURN}
      - --external-ip=${LUMA_TURN_PUBLIC_IP}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  luma-data:
